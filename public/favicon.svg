<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Royal Blue Gradient -->
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle Premium Shadow for Contrast on Light/Dark Google background -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Centered Bold Blue Omega (Ω) Symbol -->
  <path d="M 76 408 H 176 A 144 144 0 1 1 336 408 H 436"
        fill="none"
        stroke="url(#omegaGrad)"
        stroke-width="76"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />
</svg>